name: prek

on:
  push:
    branches-ignore:
      - "chore/deps"
      - "dependabot/**"
  pull_request:
  workflow_dispatch:

concurrency:
  cancel-in-progress: ${{ github.ref != format('refs/heads/{0}', github.event.repository.default_branch) }}
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}

permissions:
  contents: read

jobs:
  run-prek:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: checkout repo
        uses: actions/checkout@v7

      - name: setup tools
        uses: ./.github/actions/setup-tools

      - name: execute
        run: |
          uv run  --frozen \
             prek --all-files \
                  --config .prek.toml \
                  --color always \
                  --show-diff-on-failure \
                  --skip no-commit-to-branch \
                  --skip pre-commit
