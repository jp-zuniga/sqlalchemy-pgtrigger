[report]
  exclude_also = [
    "def __str__",
    "def __repr__",
  ]

  omit = [
    "*/__init__.py",
    "consts.py",
    "aliases.py",
    "consts.py",
    "enums.py",
  ]

  fail_under   = 10
  show_missing = true
  skip_covered = true

[run]
  branch = true

  omit = [
    "*/__init__.py",
    "consts.py",
    "aliases.py",
    "consts.py",
    "enums.py",
  ]

  source = ["pgtrigger"]
